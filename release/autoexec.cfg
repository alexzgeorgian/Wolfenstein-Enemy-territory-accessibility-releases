// autoexec.cfg - Wolfenstein: Enemy Territory accessibility mode
//
// Put this file at:
//     Documents\ETLegacy\legacy\autoexec.cfg
//
// ET: Legacy runs it automatically every time the game starts, after
// it has loaded your saved settings, so anything set here wins.
//
// If you already have an autoexec.cfg, do not overwrite it. Paste the
// lines below onto the end of the one you have.
//
// Lines beginning with two slashes are comments and do nothing.


// ---------------------------------------------------------------
// 1. The three keys
// ---------------------------------------------------------------
//
// These are the only things the mod cannot do for itself. Everything
// else - menu narration, setting values, all five cue sounds - is
// automatic and needs no key.
//
// F5 reports your status: health, weapon, ammo, the current objective,
// how far away it is, and which way to turn.
//
// F6 says the last thing again - the word that was missed because a
// gunshot landed on top of it. In a menu it repeats the item you are
// on, which is otherwise only spoken once, when focus arrives.
//
// F8 cuts speech off. An objective report is several seconds long and
// there is no other way to interrupt it. It sits away from F6 on
// purpose, so reaching for "say that again" cannot land on "shut up".

bind F5 accessibilityStatus
bind F6 accessibilityRepeat
bind F8 accessibilityStopSpeech

// Health and ammo on their own, because the full F5 report takes
// several seconds to reach them and a firefight does not wait. These
// two sit under the hand that is already on the movement keys.

bind 9 accessibilityHealth
bind 0 accessibilityAmmo

// The scope key. `weapalt` is how a rifle goes to its scope, a mortar
// and a machine gun are set down, and a satchel is detonated. The stock
// game binds it to the RIGHT MOUSE BUTTON and to nothing else - it is
// the only action in the whole default config with no key at all, so
// without a mouse none of it can be reached. Keypad slash is free in
// both of the game's own layouts.

bind KP_SLASH weapalt

// Turning and looking.
//
// The stock game binds no key to either. Aiming is the mouse and
// nothing but the mouse - the default config has no key for turning
// left, turning right, or tipping the view up and down anywhere in it.
// Without these four, the compass can tell you that you are facing
// south and you have no way to do anything about it.
//
// Left and right turn on the spot. A tap turns to the next of the eight
// compass points and says it as it lands - two taps turn a quarter, the
// way a flick of the mouse would - and holding the key turns smoothly,
// naming each point as you cross it, and stops where you let go. Set
// eta_turnSteps to 0 below for a smooth turn however the key is pressed,
// or bind +left and +right yourself. Up and down tip the view, and the
// mod says what you have ended up pointing at - "Open sky", "Concrete
// ground, 3 meters", "Wooden ceiling" - once you stop moving it, so a
// sweep names where you finished rather than everything it crossed.
//
// There is no key here for putting the view back level, because the
// game has no command for it. ET's own left-handed layout binds HOME to
// "centerview", and that command does not exist anywhere in ET: Legacy
// - it is a dead bind that has shipped for years. Only the game's own
// executable could add one. So the report is how you find level again:
// hold Down until it tells you the ground is a few metres away.

bind LEFTARROW  +accessibilityTurnLeft
bind RIGHTARROW +accessibilityTurnRight
bind UPARROW    +lookup
bind DOWNARROW  +lookdown

// The command map survey. Hold the map key - G in the stock controls -
// and these walk a cursor over the map square by square. They do
// nothing at all while the map key is not held, so they keep whatever
// job they already had the rest of the time.
//
// The four directions sit on the keypad's arrow cluster, which has the
// same shape as the one above under the other hand, and KP_5 in the
// middle of it puts the cursor back on you - so does Home, which kept
// that job. Page Up and Page Down change floor on a multi-storey map,
// and End jumps to the next square with something in it.
//
// The keypad arrows are not free: the stock game puts "selectbuddy" on
// them, which picks a fireteam member out by slot number. Taking them
// costs five of its eight slots, and that is a deliberate trade -
// selectbuddy needs a fireteam, a roster you know the order of and a
// second command after it, while reading the map is how you find out
// where anything is at all. KP_END and KP_HOME keep slots 0 and 6. If
// you use fireteams heavily, move the survey somewhere else here.

bind KP_UPARROW    accessibilityMapNorth
bind KP_DOWNARROW  accessibilityMapSouth
bind KP_RIGHTARROW accessibilityMapEast
bind KP_LEFTARROW  accessibilityMapWest
bind KP_5          accessibilityMapHere
bind PGUP          accessibilityMapUp
bind PGDN          accessibilityMapDown
bind HOME          accessibilityMapHere
bind END           accessibilityMapNext

// Your own marker. Keypad 0 places it: with the map key held and the
// cursor moved onto a square, on that square; otherwise where you are
// standing, so you can find your way back to it. Keypad dot says how far
// it is and which way to turn, and keypad star takes it away. Walking
// into the marked square - or back to within three metres of a spot -
// says "Marker reached" and clears it. None of the three keys is bound
// in the stock game.
bind KP_INS        accessibilityMarkerPlace
bind KP_DEL        accessibilityMarkerWhere
bind KP_STAR       accessibilityMarkerClear

// The marker on the objective. Keypad plus puts the marker on your
// team's current objective, and its sound then leads the way there -
// round walls, up stairs, to the foot of a ladder, and to a ledge you
// have to jump onto, with "Jump up" said as you reach it. For an
// objective on a floor above, like the Oasis command post. Press it again
// within five seconds for the next objective on your command map, and
// again for the one after - "Marker on Garrison MG Nest, 3 of 7". The
// stock game has selectbuddy -1 here, which picks your whole fireteam.
bind KP_PLUS       accessibilityMarkerObjective

// What is around me. Says whether you are indoors or outdoors, which
// compass directions are open and how far, which have a wall close by,
// any window, and the named things near you - a truck, a door, a crate -
// with their direction, distance and whether you have a clear line to
// them. F9 is free in the stock game; the left-handed layout opens the
// stats there, and the mod leaves it alone in that case.
bind F9            accessibilitySurroundings

// The enemy lock. INS, held, locks on to the nearest enemy in sight and
// keeps your sights on them until you let go; it moves on to the next
// enemy in sight when one goes down. The lock works only in a game you
// host, or on a server whose host allows it (sets eta_aimAssist 1). INS
// is free in the stock right-handed layout; the left-handed one looks
// down on it, and the mod leaves it alone.
bind INS           +accessibilityAimLock

// The use key, for everything to use. With something under the
// crosshair to use, F uses it, as it always has. With nothing there, it
// turns you to the nearest thing you can use - a construction, a door, a
// cabinet, something on the ground, a wounded teammate - and uses it if
// it is within reach; further off, it says what it is and where, keeps
// you facing it while you walk, and says "in reach, F to use" when you
// get there. Press it again within a few seconds for the next one. Nothing close by, and it
// is the plain use key. The left-handed layout uses ENTER; bind that to
// +accessibilityActivate yourself for the same there.
bind f             +accessibilityActivate

// Choosing what F turns to, when several things to use are close
// together - a dynamite spot beside a door beside a cabinet. ] says the
// next one, nearest first, and [ the one before - name, direction,
// distance, "2 of 4" - without turning you. Then F turns to the one you
// chose and uses it if it is in reach, whatever the crosshair is on.
// The left-handed layout zooms the map on [ and ]; bind these two to
// other keys there.
bind ]             accessibilityUseNext
bind [             accessibilityUsePrev

// Sniper spots. / puts the marker on the nearest high place that looks
// out a long way - a rooftop, a balcony, a ledge, an upper floor window -
// and says what it sees: "Sniper spot 1 of 9: Rooftop, sees 60 meters to
// the south-east, 6 meters up". Press it again within five seconds for
// the next one, further off. The marker's sound then leads you there, up
// the stairs or the ladder, and arriving says which way to look. The
// spots are found in the map itself in the first seconds of a map. / is
// free in both stock layouts.
bind /             accessibilitySniperSpot

// Rooms. ' (apostrophe) puts the marker on the nearest room you can walk
// into, with the map's own name for the place, its floor and its size:
// "Room 1 of 12: Water Pump, ground floor, 8 by 6 meters". Press it again
// within five seconds for the next one. The marker's sound leads you
// there, through the door, and arriving says "Marker reached, inside the
// Water Pump". The left-handed layout expands the map on '; bind this to
// another key there.
bind '             accessibilityRoom

// The way out. ; (semicolon), inside a building, puts the marker on the
// nearest way out under the open sky, and the marker's sound leads you
// there through the door: "Way out, 12 meters". Outside, it puts it on
// the nearest way into a building. Press it again within five seconds
// for another way. ; is free in both stock layouts.
bind ;             accessibilityWayOut

// Facing the way to the marker. Shift+N turns you toward the way to your
// marker, round the walls, where its sound is, and says how far: "Facing
// the way. 40 meters to marker". Press it again whenever you have lost
// the way. N by itself still resets the spawn timer, as the game's own N
// does. (Period did this in 1.4.4; it is the game's again.)
bind n             accessibilityTimerReset

// The enemy lock by itself. Where the lock is allowed - a game you host,
// or a server that sets eta_aimAssist 1 - an enemy coming into sight is
// locked on to without holding INS. A turn key leaves you to look away
// for two seconds; opening the map or counting out a build stops it.
// Set to 0 to lock only while INS is held.
seta eta_autoLock              "1"

// Checking for a newer version of the mod. As the main menu comes up it
// says "Checking for updates", asks the mod's release page, and says the
// answer; if there is something newer a popup offers it: download, then restart now or when you quit. Set to
// 0 to stop the check at start; Options, Accessibility, Check for
// updates still asks by hand.
seta eta_updateCheck           "1"

// Why these keys: the game binds every letter from A to Z in its own
// default config, so any letter taken here silently steals something.
// F5, F6 and F8 are free (F7 is not - it is already bound).
//
// 9 and 0 are bound in the stock config, to "weaponbank 9" and
// "weaponbank 10", and neither can do anything: the engine rejects any
// bank above 9, and bank 9 itself is empty. They are the only keys
// within reach of the movement hand that cost nothing to take. The mod
// checks the engine still makes them dead before claiming them.
//
// Change any of them to whatever you prefer. KP_STAR and KP_DEL are
// also free in both of the game's layouts, so they are the safest
// alternatives. KP_INS is not - the left-handed layout uses it.
//
// Not listed here because it needs no bind: the objectives key (O by
// default) now speaks the objective as well as showing it.

// ---------------------------------------------------------------
// 2. The cue sounds
// ---------------------------------------------------------------
//
// Five short sounds the mod plays on its own. You do not have to set
// these - the values below are already the built-in defaults, and
// they are here so you can change one and hear the difference.
//
// Every path is a sound the game already ships and already uses, so
// nothing extra is downloaded.
//
// "seta" means set it and remember it.
//
// To retune a cue: change the path, save this file, restart the
// game, listen. A path the game cannot find plays nothing at all
// and says nothing about it, so change one at a time.

// Played when your health drops to 25 or below.
seta eta_cueLowHealth          "sound/player/gasp.wav"

// Played when the objective state changes.
seta eta_cueObjective          "sound/misc/referee.wav"

// Played when something in front of you can be used.
seta eta_cueInteraction        "sound/menu/select.wav"

// Played from the direction the damage came from.
seta eta_cueDamageDirection    "sound/weapons/impact/flesh1.wav"

// Played from the direction of the objective, on respawn and
// whenever you press the status key.
seta eta_cueObjectiveDirection "sound/misc/vote.wav"

// Objective callouts: an objective finished or failed is said. The
// distance on the way is the marker's now - keypad plus puts it on the
// objective. Set to 0 if you would rather have the silence.
seta eta_objectiveCallouts     "1"

// Environment callouts. Without binoculars or a scoped weapon most
// classes had nothing told to them about their surroundings at all.
// With this on, the mod names the ground when it changes underfoot -
// stone, gravel, wood, snow, water and the rest, taken from the same
// footstep the game plays - and says when a wall or a door is right in
// front of you. It also warns when the ground ahead falls away - a
// ledge, a drop that would injure you, or one that would kill you, with
// how far down it goes - and says how deep in water you are, from
// wading in to swimming. The two drop thresholds are the game's own
// falling-damage numbers for the gravity in play, not a guess. It also
// calls stairs ahead of you, up or down, and tells a single step from a
// flight of them. A ramp is left unsaid rather than called stairs.
// Set to 0 for silence about the scenery.
seta eta_environmentCallouts   "1"

// Openings as you walk. While you move, the mod watches how far the way
// runs to the north, east, south and west, and says when one of them
// opens - "Opening to the east" at a side street or the corner of a
// building - and when the wall comes back - "Wall to the east" as you
// pass it. So you hear where a street begins and where it ends, by
// compass point. The way you are walking and the way behind you are left
// to the wall-ahead callout. A doorway walked past says nothing, and
// nothing is said while you stand still. Set to 0 to turn it off; F9
// still describes everything around you when you ask.
seta eta_openingCallouts       "1"

// Players near you. An enemy in clear sight - never through a wall, and
// behind you only when close enough to hear - a wounded teammate, and
// teammates close by: ahead, left, right or behind, how many metres, and
// again as they come closer. An enemy is said moving away and going out
// of sight too. Several arriving together are one line: "3 teammates,
// nearest Bob, right, 4 meters". Set to 0 to turn it off; F9 still
// names the enemies in sight and the teammates near when you ask.
seta eta_playerCallouts        "1"

// Things on the ground. A weapon, ammo or a health pack within a few
// steps and in sight - "MP40 on the ground, ahead right, 3 meters" -
// and, for a covert op, an enemy body with its uniform still on. Each is
// said once until you walk away from it and back. Set to 0 to turn it
// off.
seta eta_groundCallouts        "1"

// Furniture and the things in a room. A chair, a bed, a bookcase, a
// crate, a barrel - and a window, from inside - said as you come within
// about a metre and a half and it is in sight: "Armchair, ahead left".
// Read from the map itself, so only what the map names is found: a plain
// wooden table built like the walls is not. Set to 0 to turn it off.
seta eta_furnitureCallouts     "1"

// Compass callouts. Says which way you are facing - north, north-east
// and so on - when it changes. The status key gives the same compass
// point for the objective alongside your own, so "objective lies north,
// you are facing south" tells you how far round to turn. It waits for
// you to stop turning before it speaks, so a sweep of the mouse names
// where you ended up instead of every heading it crossed.
//
// The same setting covers up and down, which the compass says nothing
// about. Tip the view and, once it settles, the mod says what you have
// ended up pointing at rather than the angle you are at: "Open sky",
// "Concrete ground, 3 meters", "Wooden ceiling", "Nothing in range". It
// is the same trace the binoculars use, so it never reports through a
// wall, and it stands down entirely while the binoculars or a scope are
// up, because that narration is already answering the question at the
// range you chose. Set to 0 if you would rather hear either only when
// you ask for it.
seta eta_facingCallouts        "1"

// Location callouts. Says where you are on the map - "Old City Wall",
// "Axis Command Post" - using the map's own list of named places, the
// same one that fills in the location when a sighted player types in
// team chat. So the words mean something to your team. Maps that ship
// no list fall back to the command map's grid square, so there is
// always an answer. It waits until you have actually stopped somewhere
// before speaking, because a stock map names over a hundred places and
// you cross several of them at a walk. The status key reports it too,
// without the wait. Set to 0 to silence it.
seta eta_locationCallouts      "1"

// The kind of place you come into, said as you walk: a street and which
// way it runs, an alley, a square, open ground, a building and whether
// you are on its upper floor, a balcony, a roof, or a ledge with the drop
// beside it. What most of the last few seconds agreed on, so a doorway
// does not make a new street. Set to 0 to turn it off; F9 still says it.
seta eta_placeCallouts         "1"

// Interaction callouts. When the game shows the icon that says you can
// use what is in front of you, this says what it is: "pliers, build
// here" at a construction, "pliers, defuse here" at a planted charge,
// "dynamite goes here" where a charge belongs, and the same for doors,
// ladders, machine guns, health and ammo packs. Where the game draws a
// progress bar beside the icon, the number is spoken too, so you can
// hear that somebody is already building a thing rather than that it is
// untouched. The interaction sound still plays the instant an icon
// appears; the words wait a quarter of a second, so turning through a
// supply room does not read out everything you swept past. Set to 0 to
// keep the sound and drop the words.
seta eta_interactionCallouts   "1"

// Command map survey. Open the map with the map key - G in the stock
// controls - and the keypad arrows walk a cursor across the map's own
// lettered grid, one square at a time, saying what is in each and how far away and in
// which direction it lies. End jumps to the next square with something
// in it, KP_5 puts the cursor back on you, and Page Up and Page Down
// change floor on a multi-storey map. It reports what the game sends
// your team and nothing more. Set to 0 to turn it off.
seta eta_mapCallouts           "1"

// The map key as a switch. With this on, one press of the map key opens
// the command map and it stays open - "Map open" - so both hands are free
// to walk the survey, and the next press closes it - "Map closed". Set
// to 0 for the game's own behaviour, where the map shows only while the
// key is held.
seta eta_mapToggle             "1"

// Music ducking. The narrator and the game's music are mixed by two
// different things that cannot see each other: the music is the game's,
// and the speech goes out through Windows, by way of NVDA or SAPI. So
// turning the music up really does bury the narration, and no volume
// setting anywhere can balance the two.
//
// With this below 1, the music steps back while the narrator is talking
// and comes straight back afterwards - the same fade the game's own maps
// use, so it costs nothing. 0.3 leaves the music clearly audible
// underneath; 0 silences it completely while words are being spoken.
//
// 1 is the default and means off, because this moves audio you already
// set up yourself.
//
// If a map fades its own music down, that is respected: the dip is a
// fraction of whatever the map asked for, and the music returns to the
// map's level rather than to full.
seta eta_musicDuck             "1"

// The narrator's voice - SAPI 5 only.
//
// These do nothing at all if you use NVDA, and that is deliberate rather
// than a gap. NVDA's controller library has three entry points - is it
// running, say this, stop - and none of them carries a rate, a pitch or
// a volume, because NVDA speaks at the settings you chose in NVDA. A
// game quietly overriding your own screen reader settings would be a
// bug. Change them in NVDA and the mod follows.
//
// For SAPI 5 - the fallback when NVDA is not running - there is no such
// preference to respect, so these are the only way to shape it.
//
// Rate and pitch run from -10 to 10, with 0 the voice's own default.
// Volume is a percentage from 0 to 100. Values outside those ranges are
// clamped rather than ignored.
seta eta_speechRate            "0"
seta eta_speechPitch           "0"
seta eta_speechVolume          "100"

// How loud things are, on Accessibility -> Sound: each from 0, silent,
// to 100, the level it always had. The marker's ping; the objective
// sounds (construction, demolition, flag, tank); doors; ladders; the
// crosshair tick; the alerts (low health, something to use, damage,
// the objective's direction); things to pick up; and the game's own announcer, the map's
// recorded voice saying what happened to an objective; and players' and
// bots' voice chats - "Medic!", "Need ammo" - whose words are still read
// in the chat. Turn the announcer or the voice chats down if they drown
// out the marker.
seta eta_markerVolume          "100"
seta eta_siteVolume            "100"
seta eta_doorVolume            "100"
seta eta_ladderVolume          "100"
seta eta_crosshairVolume       "100"
seta eta_cueVolume             "100"
seta eta_pickupVolume          "100"
seta eta_bumpVolume            "100"
seta eta_announcerVolume       "100"
seta eta_voiceVolume           "100"

// Door cues. Puts a creaking sound on every door within about ten
// metres, positioned in the world, so it swings around you as you turn
// and centres when you face it. A locked door creaks differently -
// duller and slower - so you can hear that it will not open without
// walking to it. Set to 0 for silence.
seta eta_doorCues              "1"

// Construction, demolition and flag cues. A site your team can build taps like
// a hammer on steel; an enemy objective you can blow up - a dynamite
// target, or something the enemy has built that can be destroyed - hisses
// like a lit fuse. Within about twenty-five metres, positioned in the
// world like the doors. A site goes quiet once it is built, a target once
// it is destroyed. A flag you can capture rings a two-note bell until your
// team holds it. A tank to escort - the Jagdpanther on Goldrush - rumbles
// like an engine, for both sides; damaged, it taps like a construction
// site for the side that repairs it. Your own team's targets and flags
// stay silent. Set to 0 for silence.
seta eta_siteCues              "1"

// Pickup cues. A sound from each health pack, ammo pack and weapon lying
// within about ten metres and in sight - the nearest three - so you can
// walk to it: two soft rising notes for health, three dry clicks for
// ammo, one heavy clank for a gun. A dropped objective, the gold or the
// documents, rings the flag's bell. Set to 0 for silence.
seta eta_pickupCues            "1"

// Landmine warnings. A landmine the game shows you - an enemy one a
// teammate has spotted, or seen close by with the battle sense skill
// that shows traps, and your own team's - is said as you come within
// about ten metres, with where and how far: "Enemy landmine, ahead, 6
// meters". Within about six metres it beeps, two fast high beeps from
// where it lies. The marker's way steps round them. A mine nobody has
// spotted stays hidden, as it is from everyone. Set to 0 for neither.
seta eta_mineCues              "1"

// Bump sounds. Walk into a wall and a dull thud sounds from where you
// hit; walk into a thing - a door, a crate, a vehicle, a player - and a
// hollow knock. Once as you hit, and again about twice a second while
// you keep pushing; walking along a wall makes none. Set to 0 for
// silence.
seta eta_bumpCues              "1"

// Ladder cues. Three knocks climbing up wooden rungs, from every ladder
// within about fifteen metres - the nearest two at a time - placed at
// the ladder itself, so you can turn to it and walk there. Read from the
// map file when the map loads, so a ladder round a corner is heard
// before you reach it; F climbs it once you are there. Set to 0 for
// silence.
seta eta_ladderCues            "1"

// Crosshair cues. While your crosshair is on somebody, a tick plays:
// bright for an enemy, low and soft for a teammate. Fast enough that a
// quick sweep across a target still registers. It reads the game's own
// crosshair, so it never sees through a wall, and a disguised covert
// operative sounds like a teammate - because that is what a sighted
// player sees. Set to 0 for silence.
seta eta_crosshairCues         "1"

// Marker sound. While you have a marker down, a ping plays about once a
// second from the direction of the marker, so you can turn until it is
// in front of you and walk toward it. It closes in on the marker itself
// for the last few metres. Set to 0 for silence; the spoken distances
// still come.
seta eta_markerCues            "1"

// Turning in steps. With the arrow keys on +accessibilityTurnLeft and
// +accessibilityTurnRight (above), a tap turns to the next compass point
// and a hold turns smoothly. 0 makes both keys turn smoothly however they
// are pressed.
seta eta_turnSteps             "1"

// The eighteen sounds the mod brings with it. Unlike the cues above, these
// are not sounds the game already ships: they loop continuously and
// nothing in ET's sound set does that without grating. They live inside
// the pk3. Point one at any other sound file if you prefer.
seta eta_cueDoor               "sound/accessibility/door_creak.wav"
seta eta_cueDoorLocked         "sound/accessibility/door_creak_locked.wav"
seta eta_cueCrosshairEnemy     "sound/accessibility/crosshair_enemy.wav"
seta eta_cueCrosshairTeammate  "sound/accessibility/crosshair_teammate.wav"
seta eta_cueMarker             "sound/accessibility/marker_beacon.wav"
seta eta_cueBuildSite          "sound/accessibility/build_site.wav"
seta eta_cueDemolitionTarget   "sound/accessibility/demolition_target.wav"
seta eta_cueFlag               "sound/accessibility/flag_capture.wav"
seta eta_cueLadder             "sound/accessibility/ladder.wav"
seta eta_cueMarkerSide         "sound/accessibility/marker_side.wav"
seta eta_cueMarkerBehind       "sound/accessibility/marker_behind.wav"
seta eta_cueHealthPack         "sound/accessibility/health_pack.wav"
seta eta_cueAmmoPack           "sound/accessibility/ammo_pack.wav"
seta eta_cueWeapon             "sound/accessibility/weapon_ground.wav"
seta eta_cueTank               "sound/accessibility/tank.wav"
seta eta_cueMine               "sound/accessibility/landmine.wav"
seta eta_cueBumpWall           "sound/accessibility/bump_wall.wav"
seta eta_cueBumpObject         "sound/accessibility/bump_object.wav"
